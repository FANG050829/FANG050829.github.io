<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>

    <header class="site-header">
      <div class="container site-header-inner">
        <a class="site-title" href="{{ '/' | absolute_url }}">{{ site.github.owner_name | default: site.title }}</a>

        <nav class="site-nav" aria-label="页面导航">
          <a class="nav-link nav-anchor" href="#projects">项目</a>
          <a class="nav-link nav-anchor" href="#skills">技能</a>
          <a class="nav-link nav-anchor" href="#contact">联系</a>

          <a class="nav-link nav-github" href="{{ site.github.owner_url | default: 'https://github.com/FANG050829' }}" target="_blank" rel="noopener noreferrer">
            <svg class="icon" viewBox="0 0 16 16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
            GitHub
          </a>

          <button class="theme-toggle" type="button" aria-label="切换深色 / 浅色主题">
            <span class="icon icon-sun" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
            </span>
            <span class="icon icon-moon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 14.5A8.2 8.2 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg>
            </span>
            <span class="label">深色模式</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="main" class="container">
      {{ content }}

      <footer class="site-footer">
        <p>© {{ site.time | date: '%Y' }} {{ site.github.owner_name | default: 'FANG050829' }}</p>
        <p><a href="{{ site.github.repository_url | default: 'https://github.com/FANG050829/FANG050829.github.io' }}">查看源码</a><span class="footer-dot" aria-hidden="true">·</span>基于 GitHub Pages 构建</p>
      </footer>
    </main>
  </body>
</html>
