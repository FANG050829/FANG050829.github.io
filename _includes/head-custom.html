<!-- 自定义 head 内容：在官方 minimal 主题基础上增强 -->

<!-- 主题切换：脚本同步执行，先于样式渲染，避免深色模式下的白屏闪烁 -->
<script>
  (function () {
    try {
      var stored = localStorage.getItem("theme");
      var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      var theme = stored || (prefersDark ? "dark" : "light");
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    } catch (e) {
      /* 隐私模式下 localStorage 可能不可用，忽略即可 */
    }
  })();
</script>

<!-- 主题切换按钮：官方布局 header 由主题提供，改动成本高，这里用脚本注入 -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var header = document.querySelector("header");
    if (!header) return;

    var button = document.createElement("button");
    button.className = "theme-toggle";
    button.type = "button";
    button.setAttribute("aria-label", "切换深色 / 浅色主题");

    // 太阳图标：点击后切到浅色
    button.innerHTML =
      '<span class="icon icon-sun" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/>' +
      '<path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>' +
      "</span>" +
      '<span class="icon icon-moon" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24"><path d="M20 14.5A8.2 8.2 0 019.5 4 8.5 8.5 0 1020 14.5z"/></svg>' +
      "</span>" +
      '<span class="label"></span>';

    var label = button.querySelector(".label");

    function syncLabel() {
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      label.textContent = isDark ? "浅色模式" : "深色模式";
    }

    syncLabel();

    button.addEventListener("click", function () {
      var isDark = document.documentElement.getAttribute("data-theme") === "dark";
      var next = isDark ? "light" : "dark";

      if (next === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
      } else {
        document.documentElement.removeAttribute("data-theme");
      }

      try {
        localStorage.setItem("theme", next);
      } catch (e) {
        /* 忽略存储失败 */
      }

      syncLabel();
    });

    // 放在 header 末尾：描述语之后、footer 之前
    header.appendChild(button);
  });
</script>

<!-- 未启用 JS 时不显示切换按钮 -->
<noscript>
  <style>
    .theme-toggle { display: none; }
  </style>
</noscript>
